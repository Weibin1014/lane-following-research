<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Readable research record and source-code preview from the lane-following experiment archive.">
  <title>Research record · Lane / Lab</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./reader.css">
  <link rel="stylesheet" href="./thesis.css">
  <script src="./file-labels.js" defer></script>
  <script src="./reader.js" defer></script>
</head>
<body>
  <a class="skip" href="#document">Skip to document</a>
  <header class="site-header reader-header">
    <a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>LANE / LAB <small>Research archive</small></span></a>
    <a class="header-action" href="./index.html#archive">← Back to archive</a>
  </header>
  <main id="document" class="reader-shell">
    <div class="reader-intro">
      <p class="overline">ORIGINAL RESEARCH RECORD</p>
      <h1 id="document-title">Loading document…</h1>
      <p id="document-path" class="reader-path"></p>
      <p id="document-context" class="reader-context"></p>
      <div class="reader-actions"><a id="raw-link" class="reader-raw" href="#" download>Download original file ↓</a><button id="copy-code" class="reader-copy" type="button" hidden>Copy code</button><span id="copy-status" role="status" aria-live="polite"></span></div>
    </div>
    <div id="reader-notice" class="reader-notice" hidden></div>
    <div id="language-switch" class="language-switch" hidden aria-label="Document language"><span>READ IN</span><button id="english-version" type="button" aria-pressed="true">English</button><button id="original-version" type="button" aria-pressed="false">Original Chinese</button></div>
    <p id="translation-status" class="translation-status" hidden></p>
    <article id="reader-body" class="reader-body" aria-live="polite"><p>Loading the original file…</p></article>
  </main>
</body>
</html>
